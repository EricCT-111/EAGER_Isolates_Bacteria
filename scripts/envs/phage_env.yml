name: phage_env
channels: [conda-forge, bioconda]
dependencies:
  - pharokka >=1.7
  - checkv >=1.0
  - python >=3.9
  - hmmer  # Pharokka dep
  - prodigal-gv  # alt gene caller
  - phanotate  # default caller
  - aragorn  # tRNA detection
  - minced  # CRISPR detection
  - mash  # used on inphared db for closest org
